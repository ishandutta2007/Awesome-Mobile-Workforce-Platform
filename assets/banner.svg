<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .pulse-circle {
      animation: pulse 3s infinite alternate ease-in-out;
    }
    .dash-line {
      stroke-dasharray: 8 8;
      animation: moveDash 20s linear infinite;
    }
    .signal-wave {
      animation: wave 2.5s infinite ease-out;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      100% { r: 8px; opacity: 1; }
    }
    @keyframes moveDash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes wave {
      0% { r: 10px; opacity: 0.8; stroke-width: 2px; }
      100% { r: 32px; opacity: 0; stroke-width: 0.5px; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Placed strictly in background behind cards/text) -->
  <!-- Tech Grid Network Background -->
  <g opacity="0.15">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#94a3b8" stroke-width="1" />
    <path d="M 150,0 L 150,340 M 300,0 L 300,340 M 450,0 L 450,340 M 600,0 L 600,340 M 750,0 L 750,340 M 900,0 L 900,340 M 1050,0 L 1050,340" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Dynamic Connecting Dispatch Line (Behind Foreground Text) -->
  <path class="dash-line" d="M 80,260 Q 300,300 550,250 T 1100,80" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4" />

  <!-- Animated Radar Pulse Node 1 (Background subtle element) -->
  <g transform="translate(1000, 100)">
    <circle class="signal-wave" cx="0" cy="0" r="20" fill="none" stroke="#38bdf8" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
  </g>
  
  <!-- Animated Radar Pulse Node 2 (Background subtle element) -->
  <g transform="translate(1120, 240)">
    <circle class="signal-wave" cx="0" cy="0" r="25" fill="none" stroke="#c084fc" />
    <circle cx="0" cy="0" r="6" fill="#c084fc" />
  </g>

  <!-- FOREGROUND CONTENT CONTAINER (Cards & Text) -->
  <!-- Header Badge Container -->
  <rect x="60" y="45" width="280" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="78" cy="62" r="5" fill="#38bdf8" class="pulse-circle" />
  <text x="94" y="67" class="badge-text">COMMUNITY CURATED ECOSYSTEM</text>

  <!-- Main Title -->
  <text x="60" y="135" class="title" filter="url(#glow)">Awesome Mobile Workforce Platform</text>
  
  <!-- Decorative Accent Bar under Title -->
  <rect x="60" y="152" width="540" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="60" y="192" class="subtitle">Field Service Management • Technician Dispatch • Route Optimization • Work Orders</text>

  <!-- Stats / Tags Cards (Bottom Foreground) -->
  <g transform="translate(60, 225)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="60" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="20" y="26" font-family="system-ui" font-size="12" fill="#94a3b8" font-weight="600">ENTERPRISE SAAS</text>
    <text x="20" y="47" font-family="system-ui" font-size="15" fill="#f8fafc" font-weight="700">Market Leader Breakdown</text>

    <!-- Card 2 -->
    <rect x="240" y="0" width="220" height="60" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="260" y="26" font-family="system-ui" font-size="12" fill="#94a3b8" font-weight="600">OPEN-SOURCE TOOLS</text>
    <text x="260" y="47" font-family="system-ui" font-size="15" fill="#f8fafc" font-weight="700">Star-Ranked Repos</text>

    <!-- Card 3 -->
    <rect x="480" y="0" width="220" height="60" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="500" y="26" font-family="system-ui" font-size="12" fill="#94a3b8" font-weight="600">FIELD OPERATIONS</text>
    <text x="500" y="47" font-family="system-ui" font-size="15" fill="#f8fafc" font-weight="700">Routing &amp; Scheduling</text>
  </g>
</svg>
